<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cổng Trợ giảng · EduCenter ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../../shared/styles/common.css" />
    <link rel="stylesheet" href="assistants.css" />
  </head>
  <body class="assistant-portal">
    <div class="app">
      <!-- SIDEBAR -->
      <aside
        class="side"
        id="assistant-sidebar"
        aria-label="Điều hướng Trợ giảng"
      >
        <a class="brand" href="/">
          <span class="brand-icon">E</span>
          <span><b>EduCenter ERP</b><small>Quản trị Trung tâm Gia sư</small></span>
        </a>
        <div class="side-user">
          <span class="su-role" style="background:#064e3b;color:#34d399;font-weight:700">● TRỢ GIẢNG</span>
          <div class="su-name" id="assistant-name">Đang tải tài khoản…</div>
        </div>
        <div class="nav-group" style="padding:10px 14px 4px;font-size:11px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.05em">
          CHỨC NĂNG PHÂN HỆ
        </div>
        <nav id="assistant-nav"></nav>
        <div class="side-foot row-b">
          <a class="btn sm" href="/">Website Công khai</a>
          <button class="btn sm" data-action="logout">Đăng xuất</button>
        </div>
      </aside>
      <div id="assistant-backdrop" hidden></div>

      <!-- MAIN WRAPPER -->
      <div class="main-wrap">
        <header class="topbar">
          <div class="row">
            <button
              class="btn sm"
              id="assistant-menu"
              aria-label="Mở menu"
              aria-controls="assistant-sidebar"
              aria-expanded="false"
            >
              ☰
            </button>
            <a class="btn sm assistant-website" href="/" style="border-color:#0d9488;color:#0d9488;font-weight:600">
              ◎ Website Trung tâm
            </a>
          </div>
          <div class="row">
            <span id="assistant-date" class="row" style="gap:6px;font-size:13px;font-weight:500;color:var(--g600)">
              <svg class="svg-ico" viewBox="0 0 24 24" style="width:16px;height:16px"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4m8-4v4M3 10h18"/></svg>
              <span>...</span>
            </span>
            <button
              class="assistant-bell"
              id="assistant-bell"
              data-action="notifications"
              aria-label="Mở thông báo"
              style="position:relative;width:34px;height:34px;border-radius:50%;border:1px solid var(--g300);background:var(--w);display:inline-flex;align-items:center;justify-content:center;cursor:pointer"
            >
              <svg class="svg-ico" viewBox="0 0 24 24" style="width:16px;height:16px">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
              </svg>
              <span id="assistant-unread" hidden style="position:absolute;top:-2px;right:-2px;background:var(--err);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 5px"></span>
            </button>
            <div class="assistant-account" style="position:relative">
              <button
                id="assistant-avatar"
                data-action="account"
                aria-label="Menu tài khoản"
                aria-controls="assistant-account-menu"
                aria-expanded="false"
                style="width:34px;height:34px;border-radius:50%;background:#0d9488;color:#fff;font-weight:700;font-size:14px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center"
              >
                H
              </button>
              <section
                id="assistant-account-menu"
                class="assistant-account-menu"
                aria-label="Tài khoản cá nhân"
                hidden
              >
                <button type="button" data-action="profile-view">Hồ sơ cá nhân</button>
                <button type="button" data-action="profile">Chỉnh sửa hồ sơ cá nhân</button>
                <button type="button" data-account-action="password">Đổi mật khẩu</button>
                <button type="button" data-action="logout">Đăng xuất</button>
              </section>
            </div>
          </div>
        </header>

        <main
          class="main"
          id="assistant-content"
          tabindex="-1"
          aria-live="polite"
        >
          <div class="card" id="portalTitle">Đang tải cổng Trợ giảng…</div>
        </main>
      </div>
    </div>

    <!-- DIALOG & TOAST -->
    <dialog id="assistant-dialog" aria-labelledby="assistant-dialog-title" class="account-dialog">
      <div id="assistant-dialog-content"></div>
    </dialog>
    <div id="assistant-toast" role="status" hidden class="toast"></div>

    <script src="../../../../config/app.config.js"></script>
    <script src="../../../../shared/permissions/access.js"></script>
    <script src="../../../../shared/services/http.js"></script>
    <script src="../../../../shared/utils/helpers.js"></script>
    <script src="assistants.js"></script>
  </body>
</html>
