<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cổng Trợ giảng · EduCenter ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../../shared/styles/common.css" />
    <link rel="stylesheet" href="../../../../shared/styles/teaching-portal.css" />
    <link rel="stylesheet" href="assistants.css" />
  </head>
  <body class="assistant-portal tp-portal">
    <div class="app">
      <aside
        class="side"
        id="assistant-sidebar"
        aria-label="Điều hướng Trợ giảng"
      >
        <a class="brand" href="/"
          ><span class="brand-icon">E</span
          ><span
            ><b>EduCenter ERP</b><small>Quản trị Trung tâm Gia sư</small></span
          ></a
        >
        <div class="side-user">
          <span class="su-role">Trợ giảng</span>
          <div class="su-name" id="assistant-name">Đang tải tài khoản…</div>
        </div>
        <div class="nav-group">Chức năng phân hệ</div>
        <nav id="assistant-nav"></nav>
        <div class="side-foot">
          <button type="button" class="btn sm" data-action="logout">Đăng xuất</button>
        </div>
      </aside>
      <div id="assistant-backdrop" class="tp-backdrop" hidden></div>
      <div class="main-wrap">
        <header class="topbar">
          <div class="row">
            <button
              type="button"
              class="btn sm tp-menu"
              id="assistant-menu"
              aria-label="Mở menu"
              aria-controls="assistant-sidebar"
              aria-expanded="false"
            >
              ☰</button
            ><a class="btn sm assistant-website tp-website" href="/">◎ Website Trung tâm</a>
          </div>
          <div class="row">
            <span id="assistant-date" class="tp-date"></span
            ><button
              type="button"
              class="assistant-bell tp-bell"
              id="assistant-bell"
              data-action="notifications"
              aria-label="Mở thông báo"
            >
              <svg class="svg-ico" viewBox="0 0 24 24">
                <path
                  d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"
                /></svg
              ><span id="assistant-unread" class="tp-unread" hidden></span>
            </button>
            <div class="assistant-account tp-account">
              <button
                type="button"
                id="assistant-avatar"
                class="tp-avatar"
                data-action="account"
                aria-label="Menu tài khoản"
                aria-controls="assistant-account-menu"
                aria-expanded="false"
              >
                T
              </button>
              <section
                id="assistant-account-menu"
                class="assistant-account-menu tp-account-menu"
                aria-label="Tài khoản cá nhân"
                hidden
              >
                <button type="button" data-action="profile-view">
                  Hồ sơ cá nhân
                </button>
                <button type="button" data-action="profile">
                  Chỉnh sửa hồ sơ cá nhân
                </button>
                <button type="button" data-account-action="password">Đổi mật khẩu</button>
                <button type="button" data-action="logout">Đăng xuất</button>
              </section>
            </div>
          </div>
        </header>
        <main
          class="main"
          id="assistant-content"
          tabindex="-1"
          aria-live="polite"
        >
          <div class="card" id="portalTitle">Đang tải cổng Trợ giảng…</div>
        </main>
      </div>
    </div>
    <dialog id="assistant-dialog" class="tp-dialog" aria-labelledby="assistant-dialog-title">
      <div id="assistant-dialog-content"></div>
    </dialog>
    <div id="assistant-toast" class="tp-toast" role="status" hidden></div>
    <script src="../../../../config/app.config.js"></script>
    <script src="../../../../shared/permissions/access.js"></script>
    <script src="../../../../shared/services/http.js"></script>
    <script src="../../../../shared/utils/helpers.js"></script>
    <script src="../../../../shared/utils/teaching-portal.js"></script>
    <script src="assistants.js"></script>
  </body>
</html>
