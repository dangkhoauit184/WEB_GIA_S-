<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cổng Giáo viên · EduCenter ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../../shared/styles/common.css" />
    <link rel="stylesheet" href="../../../../shared/styles/teaching-portal.css" />
    <link rel="stylesheet" href="teachers.css" />
  </head>
  <body class="teacher-portal tp-portal">
    <div class="app">
      <aside
        class="side"
        id="teacher-sidebar"
        aria-label="Điều hướng Giáo viên"
      >
        <a class="brand" href="/"
          ><span class="brand-icon">E</span
          ><span
            ><b>EduCenter ERP</b><small>Quản trị Trung tâm Gia sư</small></span
          ></a
        >
        <div class="side-user">
          <span class="su-role">Giáo viên</span>
          <div class="su-name" id="teacher-name">Đang tải tài khoản…</div>
        </div>
        <div class="nav-group">Chức năng phân hệ</div>
        <nav id="teacher-nav"></nav>
      </aside>
      <div id="teacher-backdrop" class="tp-backdrop" hidden></div>
      <div class="main-wrap">
        <header class="topbar">
          <div class="row">
            <button
              type="button"
              class="btn sm tp-menu"
              id="teacher-menu"
              aria-label="Mở menu"
              aria-controls="teacher-sidebar"
              aria-expanded="false"
            >
              ☰</button
            >
          </div>
          <div class="top-r">
            <span class="perm">
              <svg class="ui-ico sm" style="color:var(--g500)" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span id="teacher-date"></span>
            </span>
            <button
              type="button"
              class="bell-btn teacher-bell"
              id="teacher-bell"
              data-action="notifications"
              title="Thông báo hệ thống"
              aria-label="Mở thông báo"
              aria-expanded="false"
              aria-controls="teacher-notif-panel"
            >
              <svg class="ui-ico" style="width:16px;height:16px" viewBox="0 0 24 24">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
              <b id="teacher-unread" style="display:none">0</b>
            </button>
            <div class="teacher-account tp-account" style="position:relative">
              <button
                type="button"
                id="teacher-avatar"
                class="acct-btn"
                data-action="account"
                title="Menu tài khoản"
                aria-label="Menu tài khoản"
                aria-controls="teacher-account-menu"
                aria-expanded="false"
              >
                G
              </button>
              <div
                id="teacher-account-menu"
                class="user-dropdown"
                aria-label="Tài khoản cá nhân"
                hidden
              >
                <div class="ud-info">
                  <b id="teacher-ud-name">Giáo viên</b>
                  <span style="font-size:11px;color:var(--pri-d);font-weight:600;display:block;margin-top:2px">Giáo viên</span>
                </div>
                <button type="button" class="ud-item" data-action="profile-view">Hồ sơ cá nhân</button>
                <button type="button" class="ud-item" data-action="profile">Chỉnh sửa hồ sơ cá nhân</button>
                <button type="button" class="ud-item" data-account-action="password">Đổi mật khẩu</button>
                <button type="button" class="ud-item danger" data-action="logout">Đăng xuất</button>
              </div>
            </div>
          </div>
        </header>
        <main
          class="main"
          id="teacher-content"
          tabindex="-1"
          aria-live="polite"
        >
          <div class="card">Đang tải cổng Giáo viên…</div>
        </main>
      </div>
    </div>
    <div class="notif-panel" id="teacher-notif-panel" aria-label="Thông báo hệ thống">
      <div class="np-head">
        <h3>Thông báo</h3>
        <button type="button" class="np-read-all" data-action="read-all">Đọc tất cả</button>
      </div>
      <div class="np-list" id="teacher-notif-list"></div>
    </div>
    <dialog id="teacher-dialog" class="tp-dialog" aria-labelledby="teacher-dialog-title">
      <div id="teacher-dialog-content"></div>
    </dialog>
    <div id="teacher-toast" class="tp-toast" role="status" hidden></div>
    <script src="../../../../config/app.config.js"></script>
    <script src="../../../../shared/permissions/access.js"></script>
    <script src="../../../../shared/services/http.js"></script>
    <script src="../../../../shared/utils/helpers.js"></script>
    <script src="../../../../shared/utils/teaching-portal.js"></script>
    <script src="teachers.js"></script>
  </body>
</html>
