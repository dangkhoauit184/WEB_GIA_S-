<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập hệ thống · EduCenter ERP</title>
  <link rel="stylesheet" href="/src/shared/styles/common.css">
  <style>
    /* Nền Gradient SaaS tối màu & Card nổi bật */
    .auth-bg {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 18%, rgba(20, 184, 166, 0.22) 0%, transparent 42%),
        radial-gradient(circle at 82% 82%, rgba(79, 70, 229, 0.20) 0%, transparent 45%),
        linear-gradient(160deg, #060911 0%, #0f172a 55%, #0b1324 100%);
    }

    .auth-box {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 38px 40px;
      box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-icon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--pri), var(--pri-d));
      color: #fff;
      font-size: 26px;
      margin-bottom: 12px;
      box-shadow: 0 8px 16px rgba(13, 148, 136, 0.3);
    }

    .auth-header h2 {
      font-size: 23px;
      color: var(--g900);
      margin: 0 0 4px;
      font-weight: 800;
      letter-spacing: -0.025em;
      justify-content: center;
    }

    .auth-header p {
      font-size: 13.5px;
      color: var(--g500);
      margin: 0;
    }

    .pwd-wrapper {
      position: relative;
    }
    .pwd-toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
      color: var(--g500);
      padding: 4px;
    }

    .auth-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--g600);
      margin-bottom: 20px;
    }
    .auth-options a {
      color: var(--pri-d);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-options a:hover {
      text-decoration: underline;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--g400);
      font-size: 11.5px;
      font-weight: 500;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--g200);
    }
    .auth-divider span {
      padding: 0 12px;
    }

    .alert-box {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .alert-box.show { display: block; }
    .alert-box.error { background: var(--err-ll); color: var(--err); border: 1px solid var(--err-l); }
    .alert-box.success { background: var(--ok-ll); color: var(--ok); border: 1px solid #a7f3d0; }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-card {
      background: #fff;
      border-radius: 18px;
      padding: 28px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--sh-modal);
    }
  </style>
</head>
<body>
  <div class="auth-bg">
    <div class="auth-box">
      <div class="auth-header">
        <div class="auth-icon-badge">🎓</div>
        <h2>EduCenter ERP</h2>
        <p>Hệ thống Quản lý Trung tâm Gia sư & Đào tạo</p>
      </div>

      <div id="loginAlert" class="alert-box error" role="alert"></div>

      <form id="loginForm" autocomplete="on">
        <div style="margin-bottom: 14px;">
          <label for="username">Tên đăng nhập</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Nhập tên đăng nhập..." 
            required 
            autofocus
          >
        </div>

        <div style="margin-bottom: 14px;">
          <label for="password">Mật khẩu</label>
          <div class="pwd-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Nhập mật khẩu..." 
              required
            >
            <button type="button" id="togglePassword" class="pwd-toggle-btn" title="Hiện/ẩn mật khẩu">👁️</button>
          </div>
        </div>

        <div class="auth-options">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer; margin:0; font-weight:normal; font-size:12.5px;">
            <input type="checkbox" id="rememberMe"> Ghi nhớ đăng nhập
          </label>
          <span>Quên mật khẩu? Liên hệ trung tâm để được hỗ trợ.</span>
        </div>

        <button type="submit" id="btnSubmit" class="btn p" style="width: 100%; padding: 11px; font-size: 14px; justify-content: center;">
          Đăng nhập vào Hệ thống
        </button>
      </form>

      <p style="margin:16px 0 0; text-align:center; font-size:12.8px; color:var(--g600);">
        Tài khoản phụ huynh được trung tâm cấp sau khi xác minh hồ sơ.
      </p>

      <div style="margin-top: 22px; text-align: center; font-size: 12.8px;">
        <a href="/" style="color: var(--pri-d); font-weight: 600; text-decoration: none;">
          ← Quay lại Trang chủ / Giới thiệu
        </a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/src/config/app.config.js"></script>
  <script src="/src/shared/permissions/access.js"></script>
  <script src="/src/shared/services/http.js"></script>
  <script src="/src/modules/administration/features/auth/auth.js"></script>
</body>
</html>
