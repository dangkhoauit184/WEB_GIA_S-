<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập hệ thống · EduCenter ERP</title>
  <link rel="stylesheet" href="../../../../shared/styles/common.css">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
    }

    /* Nền Gradient SaaS tối màu & Card nổi bật */
    .auth-bg {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 18%, rgba(20, 184, 166, 0.22) 0%, transparent 42%),
        radial-gradient(circle at 82% 82%, rgba(79, 70, 229, 0.20) 0%, transparent 45%),
        linear-gradient(160deg, #060911 0%, #0f172a 55%, #0b1324 100%);
    }

    .auth-box {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 38px 40px;
      box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-icon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--pri, #0d9488), var(--pri-d, #0f766e));
      color: #fff;
      font-size: 26px;
      margin-bottom: 12px;
      box-shadow: 0 8px 16px rgba(13, 148, 136, 0.3);
    }

    .auth-header h2 {
      font-size: 23px;
      color: var(--g900, #0f172a);
      margin: 0 0 4px;
      font-weight: 800;
      letter-spacing: -0.025em;
      justify-content: center;
    }

    .auth-header p {
      font-size: 13.5px;
      color: var(--g500, #64748b);
      margin: 0;
    }

    /* Form Fields Styling */
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .form-group label, .modal-card label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--g700, #334155);
      margin-bottom: 6px;
    }
    .form-group input, .modal-card input {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--g300, #cbd5e1);
      border-radius: 8px;
      font-size: 13.5px;
      font-family: inherit;
      background: #fff;
      color: var(--g900, #0f172a);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-group input:focus, .modal-card input:focus {
      outline: none;
      border-color: var(--pri, #0d9488);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.18);
    }

    .pwd-wrapper {
      position: relative;
    }
    .pwd-toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
      color: var(--g500, #64748b);
      padding: 4px;
    }

    .auth-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--g600, #475569);
      margin-bottom: 20px;
    }
    .auth-options a {
      color: var(--pri-d, #0f766e);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-options a:hover {
      text-decoration: underline;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--g400, #94a3b8);
      font-size: 11.5px;
      font-weight: 500;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--g200, #e2e8f0);
    }
    .auth-divider span {
      padding: 0 12px;
    }

    .alert-box {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .alert-box.show { display: block; }
    .alert-box.error { background: var(--err-ll, #ffe4e6); color: var(--err, #e11d48); border: 1px solid var(--err-l, #fecdd3); }
    .alert-box.success { background: var(--ok-ll, #d1fae5); color: var(--ok, #059669); border: 1px solid #a7f3d0; }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-card {
      background: #fff;
      border-radius: 18px;
      padding: 28px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--sh-modal, 0 20px 25px -5px rgba(0,0,0,0.2));
    }
  </style>
</head>
<body>
  <div class="auth-bg">
    <div class="auth-box">
      <div class="auth-header">
        <div class="auth-icon-badge">🎓</div>
        <h2>EduCenter ERP</h2>
        <p>Hệ thống Quản lý Trung tâm Gia sư & Đào tạo</p>
      </div>

      <div id="loginAlert" class="alert-box error" role="alert"></div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="username">Tên đăng nhập / Email</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Nhập tên đăng nhập hoặc email..." 
            required 
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="pwd-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Nhập mật khẩu..." 
              required
            >
            <button type="button" id="togglePassword" class="pwd-toggle-btn" title="Hiện/ẩn mật khẩu">👁️</button>
          </div>
        </div>

        <div class="auth-options">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer; margin:0; font-weight:normal; font-size:12.5px;">
            <input type="checkbox" id="rememberMe" style="width:auto; display:inline-block;"> Ghi nhớ đăng nhập
          </label>
          <a id="btnForgotPwd">Quên mật khẩu?</a>
        </div>

        <button type="submit" id="btnSubmit" class="btn p" style="width: 100%; padding: 11px; font-size: 14px; justify-content: center;">
          Đăng nhập vào Hệ thống
        </button>
      </form>

      <div class="auth-divider"><span>HOẶC</span></div>

      <div style="text-align: center;">
        <button type="button" id="btnOpenRegister" class="btn dark" style="width: 100%; padding: 10px; font-size: 13.5px; justify-content: center;">
          Tạo tài khoản Phụ huynh mới
        </button>
      </div>

      <div style="margin-top: 22px; text-align: center; font-size: 12.8px;">
        <a href="../../../../../index.html" style="color: var(--pri-d, #0f766e); font-weight: 600; text-decoration: none;">
          ← Quay lại Trang chủ / Giới thiệu
        </a>
      </div>
    </div>
  </div>

  <!-- Modal Quên Mật Khẩu -->
  <div id="modalForgotPassword" class="modal-overlay">
    <div class="modal-card" style="max-width: 480px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--g200, #e2e8f0); padding-bottom:10px;">
        <h3 style="margin:0; font-size:17px; font-weight:700; color:var(--g900, #0f172a);">🔑 Quên Mật Khẩu</h3>
        <button type="button" id="closeForgotModal" style="border:0; background:0; font-size:18px; cursor:pointer; color:var(--g400, #94a3b8);">✕</button>
      </div>
      <p style="font-size:13px; color:var(--g600, #475569); line-height:1.5; margin-bottom:14px;">
        Nhập Email hoặc Tên đăng nhập đã đăng ký để nhận mã xác nhận OTP và đặt lại mật khẩu mới.
      </p>
      <div id="forgotAlert" class="alert-box" role="alert"></div>
      <form id="forgotPwdForm">
        <div class="form-group">
          <label for="forgotEmail">Email / Tên đăng nhập</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="forgotEmail" placeholder="ví dụ: phuhuynh@gmail.com" required style="flex:1;">
            <button type="button" id="btnSendOtp" class="btn p sm" style="white-space:nowrap; padding:0 14px;">Lấy mã OTP</button>
          </div>
        </div>
        <div class="form-group">
          <label for="forgotOtp">Mã xác nhận OTP</label>
          <input type="text" id="forgotOtp" placeholder="Nhập mã OTP 6 chữ số..." maxlength="6" required>
        </div>
        <div class="form-group">
          <label for="forgotNewPwd">Đặt lại mật khẩu mới (tối thiểu 6 ký tự)</label>
          <input type="password" id="forgotNewPwd" minlength="6" placeholder="Nhập mật khẩu mới..." required>
        </div>
        <div class="form-group" style="margin-bottom:18px;">
          <label for="forgotConfirmPwd">Xác nhận mật khẩu mới</label>
          <input type="password" id="forgotConfirmPwd" minlength="6" placeholder="Nhập lại mật khẩu mới..." required>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button type="button" id="btnCancelForgot" class="btn sm">Hủy</button>
          <button type="submit" id="btnSubmitForgot" class="btn p sm">Đặt lại mật khẩu</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Tạo Tài Khoản Phụ Huynh Mới -->
  <div id="modalRegister" class="modal-overlay">
    <div class="modal-card" style="max-width: 480px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--g200, #e2e8f0); padding-bottom:10px;">
        <h3 style="margin:0; font-size:17px; font-weight:700; color:var(--g900, #0f172a);">📝 Đăng Ký Tài Khoản Phụ Huynh</h3>
        <button type="button" id="closeRegisterModal" style="border:0; background:0; font-size:18px; cursor:pointer; color:var(--g400, #94a3b8);">✕</button>
      </div>
      <div id="registerAlert" class="alert-box" role="alert"></div>
      <form id="registerForm">
        <div class="form-group">
          <label for="regFullname">Họ và tên Phụ huynh</label>
          <input type="text" id="regFullname" placeholder="Nguyễn Văn A" required>
        </div>
        <div class="form-group">
          <label for="regPhone">Số điện thoại liên hệ</label>
          <input type="tel" id="regPhone" placeholder="0901234567" required>
        </div>
        <div class="form-group">
          <label for="regUsername">Tên đăng nhập mong muốn</label>
          <input type="text" id="regUsername" placeholder="ví dụ: phuhuynh_an" required>
        </div>
        <div class="form-group">
          <label for="regPassword">Mật khẩu (tối thiểu 6 ký tự)</label>
          <input type="password" id="regPassword" minlength="6" placeholder="Nhập mật khẩu..." required>
        </div>
        <div class="form-group" style="margin-bottom:18px;">
          <label for="regConfirmPassword">Xác nhận mật khẩu</label>
          <input type="password" id="regConfirmPassword" minlength="6" placeholder="Nhập lại mật khẩu..." required>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button type="button" id="btnCancelRegister" class="btn sm">Hủy</button>
          <button type="submit" id="btnSubmitRegister" class="btn p sm">Xác nhận tạo tài khoản</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../../../../config/app.config.js"></script>
  <script src="../../../../shared/permissions/access.js"></script>
  <script src="../../../../shared/services/http.js"></script>
  <script src="auth.js"></script>
</body>
</html>
