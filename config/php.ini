; Server defaults; feature code does not control the machine timezone or error disclosure.
date.timezone = Asia/Ho_Chi_Minh
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On
