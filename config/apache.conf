ServerTokens Prod
ServerSignature Off
TraceEnable Off
<Directory /var/www/educenter/backend/public>
    Options -Indexes
    Header setifempty X-Content-Type-Options "nosniff"
    Header setifempty Referrer-Policy "no-referrer-when-downgrade"
    Header setifempty Cross-Origin-Opener-Policy "same-origin-allow-popups"
    Header setifempty X-Frame-Options "SAMEORIGIN"
</Directory>
