name: educenter
services:
  backend:
    image: educenter-php-runtime:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: config/server.env
    environment:
      CI_ENVIRONMENT: production
      DB_HOST: ${EDUCENTER_DB_CONTAINER:-educenter-mysql}
      DB_PORT: 3306
    ports:
      - "127.0.0.1:${EDUCENTER_HTTP_PORT:-5000}:80"
    volumes:
      - .:/var/www/educenter
    networks:
      - database
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/health') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: [tools]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - database
networks:
  database:
    name: educenter-erp
    external: true
