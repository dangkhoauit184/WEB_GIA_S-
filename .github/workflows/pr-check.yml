name: Pull Request Verification

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, 'codex/**' ]

jobs:
  structure:
    name: Module structure and preserved references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PHP module-feature layout, four READMEs, SQL references
        run: python3 database/tests/verify_structure.py
      - name: Verify browser JavaScript syntax
        run: |
          node --check backend/public/assets/portal.js
          node -e "const fs=require('fs'); for (const match of fs.readFileSync('reference/demo/index.html','utf8').matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)) new Function(match[1]);"

  php-mysql:
    name: PHP 8.4, CodeIgniter MVC and MySQL 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and test on isolated MySQL containers
        shell: pwsh
        run: ./backend/scripts/test.ps1
      - name: Validate Composer lock and PHP syntax
        run: |
          docker run --rm --mount type=bind,source="$PWD",target=/var/www/educenter educenter-php-runtime:local composer validate --strict
          docker run --rm --mount type=bind,source="$PWD",target=/var/www/educenter educenter-php-runtime:local php scripts/lint.php
